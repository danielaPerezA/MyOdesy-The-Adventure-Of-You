<div class="login-page">
  <app-navbar />

<div class="login-register-page page-bg">

  <main class="auth-wrapper">
    <section class="auth-panel">
      <article class="brand-tag">
        <span class="brand-name">MyOdesy</span>
        <p class="brand-tagline">The adventure begins with you.</p>
      </article>

      <section class="forms">
        <section class="tab-switcher" aria-label="Seleccionar formulario">
          <button class="tab-btn" [class.active]="activeTab === 'login'" (click)="switchTab('login')">
            Iniciar sesión
          </button>
          <button class="tab-btn" [class.active]="activeTab === 'register'" (click)="switchTab('register')">
            Registrarse
          </button>
          <div class="tab-indicator" [class.right]="activeTab === 'register'"></div>
        </section>

        <article class="auth-form slide-in" *ngIf="activeTab === 'login'">
          <form (ngSubmit)="onLogin()" #loginForm="ngForm">
            <div class="form-group">
              <label for="loginEmail">Correo electrónico</label>
              <input id="loginEmail" type="email" [(ngModel)]="loginData.email" name="email"
                placeholder="tu@correo.com" autocomplete="email" required />
            </div>
            <div class="form-group">
              <label for="loginPassword">Contraseña</label>
              <input id="loginPassword" type="password" [(ngModel)]="loginData.password" name="password"
                placeholder="••••••••" autocomplete="current-password" required />
            </div>
            <div class="remember-row">
              <label class="checkbox-label" for="remember">
                <input id="remember" type="checkbox" [(ngModel)]="loginData.remember" name="remember" />
                <span class="checkmark"></span>
                Recordar contraseña
              </label>
            </div>
            <p class="error-msg" role="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
            <button type="submit" class="submit-btn" [disabled]="loading">
              {{ loading ? 'Cargando...' : 'Acceder' }} <span class="btn-arrow">→</span>
            </button>
          </form>
        </article>

        <article class="auth-form slide-in" *ngIf="activeTab === 'register'">
          <form (ngSubmit)="onRegister()" #registerForm="ngForm">
            <div class="form-group">
              <label for="regFirstName">Nombre</label>
              <input id="regFirstName" type="text" [(ngModel)]="registerData.firstName" name="firstName"
                placeholder="Tu nombre" autocomplete="given-name" required />
            </div>
            <div class="form-group">
              <label for="regLastName">Apellido</label>
              <input id="regLastName" type="text" [(ngModel)]="registerData.lastName" name="lastName"
                placeholder="Tu apellido" autocomplete="family-name" required />
            </div>
            <div class="form-group">
              <label for="regUsername">Usuario</label>
              <input id="regUsername" type="text" [(ngModel)]="registerData.username" name="username"
                placeholder="tu.usuario" autocomplete="username" required />
            </div>
            <div class="form-group">
              <label for="regEmail">Correo electrónico</label>
              <input id="regEmail" type="email" [(ngModel)]="registerData.email" name="email"
                placeholder="tu@correo.com" autocomplete="email" required />
            </div>
            <div class="form-group">
              <label for="regPassword">Contraseña</label>
              <input id="regPassword" type="password" [(ngModel)]="registerData.password" name="password"
                placeholder="Mín. 8 caracteres" autocomplete="new-password" required />
            </div>
            <p class="error-msg" role="alert" *ngIf="errorMsg">{{ errorMsg }}</p>
            <button type="submit" class="submit-btn" [disabled]="loading">
              {{ loading ? 'Creando...' : 'Registrarse' }} <span class="btn-arrow">→</span>
            </button>
          </form>
        </article>

      </section>
      <div class="auth-footer">
        <a class="back-link" routerLink="/">← Volver al inicio</a>
      </div>
    </section>
    
  </main>
  <app-footer />
</div>
